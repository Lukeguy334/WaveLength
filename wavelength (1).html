<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wavelength</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #12151c;
    --ink-2: #191f29;
    --panel: #1c232f;
    --panel-line: #313c4c;
    --brass: #c9a24b;
    --brass-bright: #e8c572;
    --teal: #4fd1c5;
    --rose: #e2637a;
    --paper: #ede7d9;
    --muted: #8791a1;
    --shadow: rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background:
      radial-gradient(ellipse at 50% -10%, #232c3a 0%, var(--ink) 55%);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
  }

  body {
    display: flex;
    justify-content: center;
    padding: 32px 16px 64px;
  }

  .rig {
    width: 100%;
    max-width: 640px;
  }

  /* ---------- Nameplate ---------- */
  .nameplate {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
    padding: 0 4px;
  }

  .nameplate h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 6vw, 38px);
    letter-spacing: 0.06em;
    margin: 0;
    background: linear-gradient(180deg, var(--brass-bright), var(--brass));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .nameplate .round-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  /* ---------- Score rail ---------- */
  .score-rail {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 10px 18px;
    margin-bottom: 18px;
  }

  .score-rail .label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .score-rail .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--brass-bright);
  }

  .score-rail .divider {
    width: 1px;
    height: 26px;
    background: var(--panel-line);
    margin: 0 16px;
  }

  .score-rail .cell { display: flex; flex-direction: column; gap: 2px; }

  /* ---------- Spectrum plaque ---------- */
  .plaque {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: -18px;
    z-index: 2;
    box-shadow: 0 10px 24px var(--shadow);
  }

  .plaque .ends {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  .plaque .end {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(15px, 4vw, 19px);
    line-height: 1.15;
  }

  .plaque .end.left { text-align: left; color: var(--paper); }
  .plaque .end.right { text-align: right; color: var(--paper); }

  .plaque .arrow {
    flex: 0 0 auto;
    color: var(--brass);
    font-size: 18px;
    opacity: 0.8;
  }

  .clue-row {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--panel-line);
    display: none;
    align-items: center;
    gap: 10px;
  }

  .clue-row.show { display: flex; }

  .clue-row input {
    flex: 1;
    background: var(--ink-2);
    border: 1px solid var(--panel-line);
    border-radius: 7px;
    padding: 9px 12px;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
  }

  .clue-row input::placeholder { color: var(--muted); }
  .clue-row input:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }

  .clue-tag {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
  }

  .clue-echo {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--panel-line);
    font-size: 14px;
    color: var(--muted);
  }

  .clue-echo.show { display: block; }
  .clue-echo b { color: var(--paper); font-weight: 600; }

  /* ---------- Dial housing ---------- */
  .housing {
    position: relative;
    background: linear-gradient(180deg, #202836, #171d27);
    border: 1px solid var(--panel-line);
    border-radius: 18px;
    padding: 46px 18px 22px;
    box-shadow: 0 20px 40px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .rivet {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--brass-bright), var(--brass) 60%, #7a5f28 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .rivet.tl { top: 12px; left: 14px; }
  .rivet.tr { top: 12px; right: 14px; }
  .rivet.bl { bottom: 12px; left: 14px; }
  .rivet.br { bottom: 12px; right: 14px; }

  svg#dial {
    width: 100%;
    height: auto;
    display: block;
    touch-action: none;
    cursor: pointer;
  }

  .dial-instructions {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
    min-height: 18px;
    letter-spacing: 0.01em;
  }

  .score-callout {
    display: none;
    text-align: center;
    margin-top: 6px;
  }
  .score-callout.show { display: block; }
  .score-callout .pts {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 34px;
    color: var(--teal);
  }
  .score-callout .pts-label {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- Controls ---------- */
  .controls {
    margin-top: 22px;
    display: flex;
    gap: 10px;
  }

  button.action {
    flex: 1;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.02em;
    padding: 14px 18px;
    border-radius: 10px;
    border: 1px solid var(--brass);
    background: linear-gradient(180deg, var(--brass-bright), var(--brass));
    color: #1c1305;
    cursor: pointer;
    transition: transform 0.08s ease, filter 0.15s ease;
  }

  button.action:hover { filter: brightness(1.06); }
  button.action:active { transform: translateY(1px) scale(0.995); }
  button.action:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  button.ghost {
    flex: 0 0 auto;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--panel-line);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  button.ghost:hover { color: var(--paper); border-color: var(--brass); }
  button.ghost:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  footer {
    text-align: center;
    margin-top: 22px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="rig">

  <div class="nameplate">
    <h1>WAVELENGTH</h1>
    <div class="round-tag" id="roundTag">ROUND 01</div>
  </div>

  <div class="score-rail">
    <div class="cell">
      <span class="label">Team score</span>
      <span class="value" id="scoreVal">0</span>
    </div>
    <div class="divider"></div>
    <div class="cell">
      <span class="label">Rounds played</span>
      <span class="value" id="roundsVal">0</span>
    </div>
    <div class="divider"></div>
    <div class="cell">
      <span class="label">Average</span>
      <span class="value" id="avgVal">&mdash;</span>
    </div>
  </div>

  <div class="plaque">
    <div class="ends">
      <div class="end left" id="endLeft">&mdash;</div>
      <div class="arrow">&#8596;</div>
      <div class="end right" id="endRight">&mdash;</div>
    </div>

    <div class="clue-row" id="clueRow">
      <span class="clue-tag">Clue</span>
      <input type="text" id="clueInput" placeholder="Type the clue word or phrase&hellip;" autocomplete="off">
    </div>

    <div class="clue-echo" id="clueEcho"></div>
  </div>

  <div class="housing">
    <div class="rivet tl"></div>
    <div class="rivet tr"></div>
    <div class="rivet bl"></div>
    <div class="rivet br"></div>

    <svg id="dial" viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- outer bezel -->
      <path id="bezel" fill="none" stroke="#0e1116" stroke-width="14" stroke-linecap="round"/>
      <path id="bezelInner" fill="none" stroke="#2a3242" stroke-width="1" stroke-linecap="round"/>

      <!-- score zones (revealed on reveal phase) -->
      <g id="zones" opacity="0"></g>

      <!-- tick marks -->
      <g id="ticks"></g>

      <!-- target marker -->
      <g id="targetMark" opacity="0">
        <line id="targetLine" stroke="var(--teal)" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"/>
        <text id="targetLabel" fill="var(--teal)" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1" text-anchor="middle">TARGET</text>
      </g>

      <!-- base plate -->
      <circle id="hub" r="10" fill="#0e1116" stroke="var(--panel-line)" stroke-width="1"/>

      <!-- needle -->
      <line id="needle" stroke="var(--rose)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
      <circle id="hubCap" r="6" fill="var(--brass-bright)" stroke="#7a5f28" stroke-width="1.5"/>
    </svg>

    <div class="dial-instructions" id="instructions">Loading the gauge&hellip;</div>
    <div class="score-callout" id="scoreCallout">
      <div class="pts" id="ptsVal">0</div>
      <div class="pts-label">points this round</div>
    </div>
  </div>

  <div class="controls">
    <button class="ghost" id="skipBtn" title="Skip this spectrum, keep the round number">Skip</button>
    <button class="action" id="mainBtn">Start guessing &rarr;</button>
  </div>

  <footer>A hidden target, a one-word clue, and a needle you have to trust.</footer>
</div>

<script>
(function(){
  // ---------------- Spectrum bank ----------------
  const SPECTRA = [
    ["Overrated", "Underrated"],
    ["Bad superpower", "Good superpower"],
    ["Practical", "Impractical"],
    ["Cheap", "Expensive"],
    ["Old-fashioned", "Futuristic"],
    ["Boring job", "Exciting job"],
    ["Common", "Rare"],
    ["Safe", "Dangerous"],
    ["Quiet", "Loud"],
    ["Simple", "Complicated"],
    ["Casual", "Formal"],
    ["Small talk topic", "Deep conversation topic"],
    ["Bad first date", "Great first date"],
    ["Underwhelming vacation", "Dream vacation"],
    ["Low-effort costume", "High-effort costume"],
    ["Villain move", "Hero move"],
    ["Mild inconvenience", "Major catastrophe"],
    ["Kid movie", "Adult movie"],
    ["Indoor activity", "Outdoor activity"],
    ["Guilty pleasure", "Genuinely good"],
    ["Overhyped trend", "Underappreciated trend"],
    ["Annoying roommate habit", "Great roommate habit"],
    ["Slow", "Fast"],
    ["Healthy", "Unhealthy"],
    ["Instant gratification", "Delayed gratification"],
    ["Niche interest", "Mainstream interest"],
    ["Introvert activity", "Extrovert activity"],
    ["Bad gift", "Great gift"],
    ["Amateur", "Professional"],
    ["Silly superstition", "Reasonable belief"],
    ["Fictional", "Realistic"],
    ["Timeless", "Trendy"],
    ["High maintenance", "Low maintenance"],
    ["Underdog", "Favorite"],
    ["Comfort food", "Fancy food"],
    ["Chill weekend", "Wild weekend"],
    ["Bad excuse", "Good excuse"],
    ["Nostalgic", "Cutting-edge"],
    ["Minor pet peeve", "Total dealbreaker"],
    ["Should be free", "Worth paying for"],
    ["Overpacked schedule", "Wide-open schedule"],
    ["Beginner-friendly", "Expert-level"],
    ["Cozy", "Sterile"],
    ["Predictable", "Unpredictable"],
    ["Underdressed", "Overdressed"],
    ["Small city", "Big city"],
    ["Sentimental gift", "Practical gift"],
    ["Quiet superpower", "Flashy superpower"],
    ["Bad workplace perk", "Great workplace perk"],
    ["Rainy day activity", "Sunny day activity"],
    ["Low risk", "High risk"],
    ["Solo activity", "Group activity"],
    ["Short-term fix", "Long-term solution"],
    ["Underrated Halloween candy", "Overrated Halloween candy"],
    ["Old technology", "New technology"],
    ["Low-stakes decision", "High-stakes decision"],
    ["Basic", "Extra"],
    ["Underdog story", "Predictable win"],
    ["Awkward conversation topic", "Easy conversation topic"],
    ["Forgettable", "Iconic"],
    ["Should stay a secret", "Fine to overshare"],
    ["Bad roommate", "Great roommate"],
    ["Waste of money", "Worth every penny"],
    ["Too spicy", "Not spicy enough"],
    ["Overplanned trip", "Spontaneous trip"],
    ["Modest", "Show-off"],
    ["Should retire early", "Should work forever"]
  ];

  let deck = [];
  function reshuffle(){
    deck = SPECTRA.slice();
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
  }
  function nextSpectrum(){
    if (deck.length === 0) reshuffle();
    return deck.pop();
  }

  // ---------------- Geometry ----------------
  const CX = 300, CY = 300, R = 230, R_BEZEL = 250;
  const svg = document.getElementById('dial');

  function polar(a, r){
    const theta = (180 - a) * Math.PI / 180;
    return { x: CX + r * Math.cos(theta), y: CY - r * Math.sin(theta) };
  }

  function arcPath(aStart, aEnd, r){
    const p1 = polar(aStart, r), p2 = polar(aEnd, r);
    const large = Math.abs(aEnd - aStart) > 180 ? 1 : 0;
    return `M ${p1.x} ${p1.y} A ${r} ${r} 0 ${large} 1 ${p2.x} ${p2.y}`;
  }

  function bandPath(aStart, aEnd, rInner, rOuter){
    const o1 = polar(aStart, rOuter), o2 = polar(aEnd, rOuter);
    const i2 = polar(aEnd, rInner), i1 = polar(aStart, rInner);
    const large = Math.abs(aEnd - aStart) > 180 ? 1 : 0;
    return `M ${o1.x} ${o1.y} A ${rOuter} ${rOuter} 0 ${large} 1 ${o2.x} ${o2.y} L ${i2.x} ${i2.y} A ${rInner} ${rInner} 0 ${large} 0 ${i1.x} ${i1.y} Z`;
  }

  document.getElementById('bezel').setAttribute('d', arcPath(0, 180, R_BEZEL));
  document.getElementById('bezelInner').setAttribute('d', arcPath(0, 180, R_BEZEL - 8));

  // ticks
  const ticksG = document.getElementById('ticks');
  for (let a = 0; a <= 180; a += 10){
    const major = (a % 30 === 0);
    const p1 = polar(a, R - (major ? 16 : 9));
    const p2 = polar(a, R);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', p1.x); line.setAttribute('y1', p1.y);
    line.setAttribute('x2', p2.x); line.setAttribute('y2', p2.y);
    line.setAttribute('stroke', major ? '#5a6577' : '#333e4d');
    line.setAttribute('stroke-width', major ? 2 : 1);
    line.setAttribute('stroke-linecap', 'round');
    ticksG.appendChild(line);
  }

  // ---------------- Scoring zones ----------------
  const ZONE_STEPS = [
    { w: 3,  color: 'var(--teal)',        alpha: 0.85, pts: 4 },
    { w: 9,  color: 'var(--teal)',        alpha: 0.55, pts: 3 },
    { w: 18, color: 'var(--brass-bright)',alpha: 0.4,  pts: 2 },
    { w: 30, color: 'var(--brass)',       alpha: 0.28, pts: 1 }
  ];

  function scoreFor(diff){
    if (diff <= 3) return 4;
    if (diff <= 9) return 3;
    if (diff <= 18) return 2;
    if (diff <= 30) return 1;
    return 0;
  }

  function buildZones(target){
    const g = document.getElementById('zones');
    g.innerHTML = '';
    let prev = 0;
    ZONE_STEPS.forEach(step => {
      const lo = Math.max(0, target - step.w);
      const hi = Math.min(180, target + step.w);
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d', bandPath(lo, hi, R - 30, R));
      path.setAttribute('fill', step.color);
      path.setAttribute('opacity', step.alpha);
      g.appendChild(path);
    });
  }

  // ---------------- State ----------------
  let phase = 'clue';      // 'clue' -> 'guess' -> 'reveal'
  let target = 90;
  let guess = 90;
  let round = 0;
  let totalScore = 0;
  let roundsPlayed = 0;

  const needle = document.getElementById('needle');
  const hubCap = document.getElementById('hubCap');
  const targetMark = document.getElementById('targetMark');
  const targetLine = document.getElementById('targetLine');
  const targetLabel = document.getElementById('targetLabel');
  const zonesG = document.getElementById('zones');
  const instructions = document.getElementById('instructions');
  const mainBtn = document.getElementById('mainBtn');
  const skipBtn = document.getElementById('skipBtn');
  const clueRow = document.getElementById('clueRow');
  const clueInput = document.getElementById('clueInput');
  const clueEcho = document.getElementById('clueEcho');
  const scoreCallout = document.getElementById('scoreCallout');
  const ptsVal = document.getElementById('ptsVal');

  function setNeedle(a){
    const tip = polar(a, R - 34);
    const base = polar(a, -14);
    needle.setAttribute('x1', base.x); needle.setAttribute('y1', base.y);
    needle.setAttribute('x2', tip.x);  needle.setAttribute('y2', tip.y);
    hubCap.setAttribute('cx', CX); hubCap.setAttribute('cy', CY);
  }

  function setTargetLine(a){
    const p1 = polar(a, R - 30);
    const p2 = polar(a, R + 6);
    targetLine.setAttribute('x1', p1.x); targetLine.setAttribute('y1', p1.y);
    targetLine.setAttribute('x2', p2.x); targetLine.setAttribute('y2', p2.y);
    const lp = polar(a, R + 20);
    targetLabel.setAttribute('x', lp.x); targetLabel.setAttribute('y', lp.y);
  }

  function newRound(){
    round += 1;
    const [left, right] = nextSpectrum();
    document.getElementById('endLeft').textContent = left;
    document.getElementById('endRight').textContent = right;
    document.getElementById('roundTag').textContent = 'ROUND ' + String(round).padStart(2,'0');

    target = Math.round(Math.random() * 180);
    guess = 90;
    phase = 'clue';

    clueInput.value = '';
    clueRow.classList.add('show');
    clueEcho.classList.remove('show');
    scoreCallout.classList.remove('show');
    zonesG.setAttribute('opacity', 0);
    targetMark.setAttribute('opacity', 1);

    setTargetLine(target);
    setNeedle(guess);
    instructions.textContent = "Psychic: note the target line, then hide the screen and give your one-word clue.";
    mainBtn.textContent = 'Start guessing \u2192';
    skipBtn.disabled = false;
  }

  function beginGuessing(){
    phase = 'guess';
    targetMark.setAttribute('opacity', 0);
    clueRow.classList.remove('show');
    if (clueInput.value.trim()){
      clueEcho.innerHTML = 'Clue given: <b>' + clueInput.value.trim().replace(/[<>]/g,'') + '</b>';
      clueEcho.classList.add('show');
    }
    instructions.textContent = "Team: drag or tap the dial to set the needle, then lock in your guess.";
    mainBtn.textContent = 'Lock guess & reveal';
    skipBtn.disabled = true;
  }

  function reveal(){
    phase = 'reveal';
    buildZones(target);
    zonesG.setAttribute('opacity', 1);
    targetMark.setAttribute('opacity', 1);

    const diff = Math.abs(guess - target);
    const pts = scoreFor(diff);
    totalScore += pts;
    roundsPlayed += 1;

    document.getElementById('scoreVal').textContent = totalScore;
    document.getElementById('roundsVal').textContent = roundsPlayed;
    document.getElementById('avgVal').textContent = (totalScore / roundsPlayed).toFixed(1);

    ptsVal.textContent = pts;
    scoreCallout.classList.add('show');
    instructions.textContent = "Target line vs. your needle. Off by " + diff.toFixed(0) + "\u00B0.";
    mainBtn.textContent = 'Next round \u2192';
    skipBtn.disabled = true;
  }

  function handleMain(){
    if (phase === 'clue') beginGuessing();
    else if (phase === 'guess') reveal();
    else newRound();
  }

  mainBtn.addEventListener('click', handleMain);
  skipBtn.addEventListener('click', () => { round -= 1; newRound(); });

  // ---------------- Pointer interaction on dial ----------------
  function angleFromEvent(evt){
    const rect = svg.getBoundingClientRect();
    const scale = 600 / rect.width; // viewBox width / rendered width
    const px = (evt.clientX - rect.left) * scale;
    const py = (evt.clientY - rect.top) * scale;
    let theta = Math.atan2(CY - py, px - CX);
    if (theta < 0) theta = (px - CX) < 0 ? Math.PI : 0;
    let a = 180 - theta * 180 / Math.PI;
    return Math.max(0, Math.min(180, a));
  }

  let dragging = false;
  function pointerDown(e){
    if (phase !== 'guess') return;
    dragging = true;
    guess = angleFromEvent(e);
    setNeedle(guess);
  }
  function pointerMove(e){
    if (!dragging || phase !== 'guess') return;
    guess = angleFromEvent(e);
    setNeedle(guess);
  }
  function pointerUp(){ dragging = false; }

  svg.addEventListener('pointerdown', pointerDown);
  svg.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);

  // ---------------- Boot ----------------
  reshuffle();
  newRound();
})();
</script>

</body>
</html>
