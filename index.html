<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Night</title>
<meta name="description" content="Browser party and board games built for playing with people &mdash; no installs, no accounts.">

<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">

<meta property="og:title" content="Game Night">
<meta property="og:description" content="Browser party and board games built for playing with people &mdash; no installs, no accounts.">
<meta property="og:image" content="assets/og-image.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Game Night">
<meta name="twitter:description" content="Browser party and board games built for playing with people &mdash; no installs, no accounts.">
<meta name="twitter:image" content="assets/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #12151c;
    --ink-2: #191f29;
    --panel: #1c232f;
    --panel-line: #313c4c;
    --brass: #c9a24b;
    --brass-bright: #e8c572;
    --teal: #4fd1c5;
    --rose: #e2637a;
    --paper: #ede7d9;
    --muted: #8791a1;
    --shadow: rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(ellipse at 50% -10%, #232c3a 0%, var(--ink) 55%);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
  }

  body {
    display: flex;
    justify-content: center;
    padding: 56px 20px 72px;
  }

  .wrap { width: 100%; max-width: 1240px; }

  /* ---------- Header ---------- */
  header { margin-bottom: 44px; }
  .site-logo { display: block; width: 100%; height: auto; margin: 0 0 28px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .eyebrow .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 6px var(--teal);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(38px, 7vw, 58px);
    letter-spacing: 0.02em;
    margin: 0 0 10px;
    background: linear-gradient(180deg, var(--brass-bright), var(--brass));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p {
    font-size: 15px;
    color: var(--muted);
    max-width: 46ch;
    line-height: 1.55;
    margin: 0;
  }

  /* ---------- Game grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }

  .card {
    position: relative;
    background: linear-gradient(180deg, #202836, #171d27);
    border: 1px solid var(--panel-line);
    border-radius: 16px;
    padding: 26px 22px 22px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    box-shadow: 0 14px 28px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.03);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.5s ease forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    border-color: var(--brass);
    box-shadow: 0 18px 34px var(--shadow), 0 0 0 1px rgba(201,162,75,0.25);
  }
  .card:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

  .rivet {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--brass-bright), var(--brass) 60%, #7a5f28 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .rivet.tl { top: 10px; left: 12px; }
  .rivet.tr { top: 10px; right: 12px; }

  .card .icon {
    width: 58px;
    height: 34px;
    margin-bottom: 16px;
  }

  .card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 21px;
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }

  .card .tagline {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.5;
    margin: 0 0 18px;
    flex: 1;
  }

  .card .meta-row {
    display: flex;
    gap: 14px;
    margin-bottom: 18px;
  }

  .card .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card .meta b { color: var(--paper); font-weight: 600; }

  .card .play {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 11px 16px;
    border-radius: 9px;
    background: linear-gradient(180deg, var(--brass-bright), var(--brass));
    color: #1c1305;
  }

  .card .play .arrow { transition: transform 0.15s ease; }
  .card:hover .play .arrow { transform: translateX(3px); }

  /* ---------- Empty slot ---------- */
  .slot {
    border: 1px dashed var(--panel-line);
    border-radius: 16px;
    padding: 26px 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    min-height: 180px;
  }

  footer {
    margin-top: 48px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .card { opacity: 1; transform: none; }
  }

  /* ---------- Toolbar ---------- */
  .toolbar { margin-bottom: 28px; }
  .search-row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }

  .search-input {
    flex: 1 1 240px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--brass); }

  .sort-select {
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--paper);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    outline: none;
    cursor: pointer;
  }
  .sort-select:focus { border-color: var(--brass); }

  .toolbar-row2 { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }

  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    padding: 8px 14px;
    border-radius: 20px;
    border: 1px solid var(--panel-line);
    background: var(--panel);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .chip:hover { border-color: var(--brass); color: var(--paper); }
  .chip.active {
    background: linear-gradient(180deg, var(--brass-bright), var(--brass));
    color: #1c1305;
    border-color: transparent;
    font-weight: 600;
  }

  .toolbar-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .tool-btn {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 9px;
    border: 1px solid var(--panel-line);
    background: var(--panel);
    color: var(--paper);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all 0.15s ease;
  }
  .tool-btn:hover { border-color: var(--teal); transform: translateY(-1px); }
  .tool-btn.primary {
    background: linear-gradient(180deg, var(--teal), #33a89c);
    color: #06201e;
    border-color: transparent;
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
    padding: 40px 20px;
    border: 1px dashed var(--panel-line);
    border-radius: 16px;
  }
  .empty-state.hidden { display: none; }

  .category-heading {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--brass-bright);
    letter-spacing: 0.03em;
    margin: 26px 0 12px;
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .category-heading:first-child { margin-top: 0; }
  .category-heading::after { content: ''; flex: 1; height: 1px; background: var(--panel-line); }

  .card.rolling {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(79,209,197,0.35), 0 18px 34px var(--shadow);
    transform: scale(1.03);
  }

  /* While the easter-egg chaos mode is active, remaining background game
     cards should not be clickable/navigable until the page resets. */
  #grid.gn-chaos-lock a.card {
    pointer-events: none;
    cursor: default;
  }

  /* ---------- Modal (quiz) ---------- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 500;
    background: rgba(10,13,18,0.72);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.hidden { display: none; }
  .modal-box {
    position: relative;
    background: linear-gradient(180deg, #202836, #171d27);
    border: 1px solid var(--panel-line);
    border-radius: 18px;
    padding: 30px 26px 26px;
    max-width: 480px;
    width: 100%;
    max-height: 86vh;
    overflow-y: auto;
    box-shadow: 0 24px 60px var(--shadow);
  }
  .modal-close {
    position: absolute; top: 14px; right: 14px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--panel-line);
    background: var(--panel);
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { color: var(--paper); border-color: var(--brass); }

  .quiz-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .quiz-q {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0 0 20px;
    line-height: 1.3;
  }
  .quiz-option {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--paper);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 10px;
    transition: all 0.15s ease;
  }
  .quiz-option:hover { border-color: var(--brass); transform: translateX(3px); }
  .quiz-progress { display: flex; gap: 6px; margin-bottom: 22px; }
  .quiz-dot { height: 4px; flex: 1; border-radius: 2px; background: var(--panel-line); }
  .quiz-dot.done { background: var(--brass); }

  .quiz-result-card {
    display: flex; gap: 16px; align-items: center;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
    text-decoration: none;
    color: inherit;
    transition: all 0.15s ease;
  }
  .quiz-result-card:hover { border-color: var(--brass); transform: translateY(-2px); }
  .quiz-result-card .icon { width: 50px; height: 30px; flex-shrink: 0; }
  .quiz-result-card h3 { font-family: 'Space Grotesk', sans-serif; font-size: 16px; margin: 0 0 4px; }
  .quiz-result-card p { font-size: 12.5px; color: var(--muted); margin: 0; line-height: 1.4; }

  .quiz-retry {
    display: block; width: 100%; text-align: center;
    background: none; border: none; color: var(--muted);
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    margin-top: 14px; cursor: pointer;
    text-decoration: underline;
  }
  .quiz-retry:hover { color: var(--paper); }

  @media (max-width: 560px) {
    .toolbar-row2 { flex-direction: column; align-items: stretch; }
    .toolbar-actions { justify-content: stretch; }
    .toolbar-actions .tool-btn { flex: 1; justify-content: center; }
  }

  /* ---------- Easter egg (type "gamenight") ---------- */
  @keyframes gn-explode { 0% { transform: translate(-50%,-50%) scale(0); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1); opacity: 0; } }
  @keyframes gn-ring { 0% { transform: translate(-50%,-50%) scale(0); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(2.5); opacity: 0; } }
  @keyframes gn-shake { 0%,100% { transform: translate(0,0); } 15% { transform: translate(-5px,3px); } 30% { transform: translate(5px,-3px); } 45% { transform: translate(-4px,2px); } 60% { transform: translate(3px,-2px); } 75% { transform: translate(-2px,1px); } }
  .gn-shaking { animation: gn-shake 0.35s ease-out; }
  @keyframes gn-bigshake { 0%,100% { transform: translate(0,0); } 10% { transform: translate(-14px,8px); } 20% { transform: translate(14px,-10px); } 30% { transform: translate(-10px,14px); } 40% { transform: translate(12px,-8px); } 50% { transform: translate(-8px,12px); } 60% { transform: translate(10px,-6px); } 70% { transform: translate(-6px,8px); } 80% { transform: translate(8px,-4px); } 90% { transform: translate(-4px,4px); } }
  .gn-bigshaking { animation: gn-bigshake 0.8s ease-out; }
  @keyframes gn-quake { 0%,100% { transform: translate(0,0); } 12% { transform: translate(-12px,7px); } 25% { transform: translate(10px,-9px); } 37% { transform: translate(-8px,11px); } 50% { transform: translate(11px,-7px); } 62% { transform: translate(-9px,8px); } 75% { transform: translate(8px,-10px); } 87% { transform: translate(-7px,6px); } }
  .gn-quaking { animation: gn-quake 0.12s linear infinite; }
  @keyframes gn-spin-logo { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes gn-fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes gn-progress-fill { from { width: 0; } to { width: 100%; } }
  @keyframes gn-nuke-blink { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <img class="site-logo" src="assets/logo-header.png" alt="Game Night">
    <div class="eyebrow"><span class="dot"></span> <span id="gameCount">12</span> games online</div>
    <h1 class="sr-only">Game Night</h1>
    <p>Browser games built for playing with people &mdash; no installs, no accounts. Pick one below.</p>
  </header>

  <div class="toolbar">
    <div class="search-row">
      <input type="search" id="searchInput" class="search-input" placeholder="Search games...">
      <select id="sortSelect" class="sort-select">
        <option value="featured">Sort: Featured</option>
        <option value="az">Sort: A &rarr; Z</option>
        <option value="za">Sort: Z &rarr; A</option>
        <option value="players">Sort: Player count</option>
        <option value="category">Sort: By category</option>
      </select>
    </div>
    <div class="toolbar-row2">
      <div class="chip-row" id="categoryChips"></div>
      <div class="toolbar-actions">
        <button class="tool-btn" id="randomBtn">&#127922; Surprise me</button>
        <button class="tool-btn primary" id="quizBtn">&#129513; What should we play?</button>
      </div>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty-state hidden" id="emptyState">No games match &ldquo;<span id="emptyQuery"></span>&rdquo;. Try another search or category.</div>

  <footer>More games get added to the rack as they're built.</footer>
</div>

<div class="modal-overlay hidden" id="quizModal">
  <div class="modal-box">
    <button class="modal-close" id="quizClose">&times;</button>
    <div id="quizBody"></div>
  </div>
</div>

<script>
  // Add a new object here to add a new game to the page.
  const GAMES = [
    {
      title: 'Wavelength',
      tagline: 'Give a one-word clue. Your team guesses where it lands on the hidden dial. Play locally on one screen, or host an online room and play across two.',
      players: '2+',
      time: '~20 min',
      href: 'wavelength.html',
      category: 'Party', playerMin: 2, playerMax: 99, timeMin: 20, vibes: ['brain', 'simple'],
      icon: `<svg viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 62 A 50 50 0 0 1 110 62" fill="none" stroke="var(--panel-line)" stroke-width="6" stroke-linecap="round"/>
        <path d="M22 62 A 38 38 0 0 1 55 26" fill="none" stroke="var(--teal)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
        <line x1="60" y1="62" x2="86" y2="24" stroke="var(--rose)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="60" cy="62" r="5" fill="var(--brass-bright)"/>
      </svg>`
    },
    {
      title: 'Gin Rummy',
      tagline: 'Meld sets and runs, play off the table at will, and race to go out. House rules included &mdash; deep discard takes, grabbing missed cards, and a few surprises.',
      players: '2\u20134',
      time: '~15 min/hand',
      href: 'gin-rummy.html',
      category: 'Card', playerMin: 2, playerMax: 4, timeMin: 15, vibes: ['challenge'],
      icon: `<svg viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg">
        <rect x="14" y="10" width="34" height="48" rx="5" fill="#f6f3ea" stroke="var(--panel-line)" stroke-width="2" transform="rotate(-8 31 34)"/>
        <rect x="44" y="8" width="34" height="48" rx="5" fill="#f6f3ea" stroke="var(--panel-line)" stroke-width="2"/>
        <rect x="72" y="12" width="34" height="48" rx="5" fill="#f6f3ea" stroke="var(--panel-line)" stroke-width="2" transform="rotate(8 89 36)"/>
        <text x="61" y="34" font-family="Georgia,serif" font-size="16" fill="var(--rose)" text-anchor="middle">K&#9829;</text>
      </svg>`
    },
    {
      title: 'Tic-Tac-Toe',
      tagline: 'Three in a row wins. Play vs computer at three difficulty levels, or challenge a friend online. Timed or untimed.',
      players: '1\u20132',
      time: '~2 min',
      href: 'tictactoe.html',
      category: 'Board', playerMin: 1, playerMax: 2, timeMin: 2, vibes: ['simple'],
      icon: `<svg viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg">
        <line x1="42" y1="10" x2="42" y2="60" stroke="var(--panel-line)" stroke-width="3"/>
        <line x1="78" y1="10" x2="78" y2="60" stroke="var(--panel-line)" stroke-width="3"/>
        <line x1="18" y1="27" x2="102" y2="27" stroke="var(--panel-line)" stroke-width="3"/>
        <line x1="18" y1="47" x2="102" y2="47" stroke="var(--panel-line)" stroke-width="3"/>
        <path d="M25 14 L37 24 M37 14 L25 24" stroke="var(--teal)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="60" cy="37" r="7" fill="none" stroke="var(--rose)" stroke-width="3"/>
        <path d="M85 50 L97 60 M97 50 L85 60" stroke="var(--teal)" stroke-width="3" stroke-linecap="round"/>
      </svg>`
    },
    {
      title: 'Connect Four',
      tagline: 'Drop pieces, get four in a row. Play vs computer at three difficulty levels, or challenge a friend online. Timed or untimed.',
      players: '1\u20132',
      time: '~5 min',
      href: 'connect4.html',
      category: 'Board', playerMin: 1, playerMax: 2, timeMin: 5, vibes: ['challenge'],
      icon: `<svg viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg">
        <rect x="14" y="8" width="92" height="54" rx="6" fill="var(--panel-line)" opacity="0.3"/>
        <circle cx="30" cy="22" r="8" fill="var(--rose)"/>
        <circle cx="50" cy="22" r="8" fill="var(--brass-bright)"/>
        <circle cx="30" cy="40" r="8" fill="var(--brass-bright)"/>
        <circle cx="50" cy="40" r="8" fill="var(--rose)"/>
        <circle cx="70" cy="40" r="8" fill="var(--brass-bright)"/>
        <circle cx="30" cy="58" r="8" fill="var(--rose)"/>
        <circle cx="50" cy="58" r="8" fill="var(--rose)"/>
        <circle cx="70" cy="58" r="8" fill="var(--rose)"/>
        <circle cx="90" cy="58" r="8" fill="var(--brass-bright)"/>
      </svg>`
    },
    {
      title: 'Chess',
      tagline: 'The classic, full rules included. Play vs computer at three difficulty levels, or challenge a friend online. Timed or untimed.',
      players: '1\u20132',
      time: '~20 min',

  // ============================================================
  // Search / filter / sort state
  // ============================================================
  const CATEGORIES = ['All', 'Party', 'Board', 'Trivia', 'Card'];
  const CATEGORY_ORDER = ['Party', 'Board', 'Trivia', 'Card'];
  const state = { query: '', category: 'All', sort: 'featured' };

  function matchesFilter(g){
    const q = state.query.trim().toLowerCase();
    if (q && !g.title.toLowerCase().includes(q) && !g.tagline.toLowerCase().includes(q) && !g.category.toLowerCase().includes(q)) return false;
    if (state.category !== 'All' && g.category !== state.category) return false;
    return true;
  }

  function sortedGames(list){
    const arr = list.slice();
    if (state.sort === 'az') arr.sort((a,b) => a.title.localeCompare(b.title));
    else if (state.sort === 'za') arr.sort((a,b) => b.title.localeCompare(a.title));
    else if (state.sort === 'players') arr.sort((a,b) => (a.playerMin - b.playerMin) || (a.playerMax - b.playerMax));
    return arr;
  }

  function buildCard(game, i){
    const card = document.createElement('a');

  function renderGrid(){

    const filtered = GAMES.filter(matchesFilter);

    if (!filtered.length){
      emptyState.classList.remove('hidden');
      emptyQuery.textContent = state.query || 'that category';
      return;
    }
    emptyState.classList.add('hidden');

    if (state.sort === 'category'){
      CATEGORY_ORDER.forEach(cat => {

    if (quizStep >= QUIZ_QUESTIONS.length){

  function scoreGame(g, answers){
    let score = 0;
    const pc = answers.players;
    const wantMin = pc === 'solo' ? 1 : pc === 'two' ? 2 : pc === 'small' ? 3 : 6;
    const wantMax = pc === 'solo' ? 1 : pc === 'two' ? 2 : pc === 'small' ? 5 : 99;
    if (g.playerMin <= wantMax && g.playerMax >= wantMin) score += 3;
    else score -= 4;

    const t = answers.time;
    if (t === 'quick' && g.timeMin <= 10) score += 2;
    else if (t === 'medium' && g.timeMin >= 8 && g.timeMin <= 25) score += 2;
    else if (t === 'any') score += 1;

    if (g.vibes.includes(answers.vibe)) score += 3;

    return score;
  }

  function renderQuizResult(){
    const scored = GAMES.map(g => ({ g, s: scoreGame(g, quizAnswers) })).sort((a, b) => b.s - a.s);

    const picks = howmany === 'one' ? scored.slice(0, 1) : scored.slice(0, 3);

  quizModal.addEventListener('click', (e) => { if (e.target.id === 'quizModal') closeQuiz(); });

// ================================================================

    if (_mhist.length > 8) _mhist.shift();

    for (const p of _items){
      if (!p.dragging) continue;
      p.x = _mouseX - p.grabOffX;
      p.y = _mouseY - p.grabOffY;

    const cxa = a.x + a.w / 2, cya = a.y + a.h / 2;
    const cxb = b.x + b.w / 2, cyb = b.y + b.h / 2;
    const ox = (a.w + b.w) / 2 - Math.abs(cxa - cxb);
    const oy = (a.h + b.h) / 2 - Math.abs(cya - cyb);
    if (ox <= 0 || oy <= 0) return;
    const E = 0.82;
    if (ox < oy){
      const sign = cxa < cxb ? -1 : 1;
      a.x += sign * ox * 0.5; b.x -= sign * ox * 0.5;

  function _shuffled(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // Wires up both mouse and touch "grab" for a spawned falling item.
  // Mirrors the old inline mousedown handler exactly, plus a touchstart
  // twin so dragging and throwing work the same way on a touchscreen.
  function _attachDrag(el, p){
    function grab(clientX, clientY){
      const mx = clientX + window.scrollX, my = clientY + window.scrollY;
      p.dragging = true; p.grabOffX = mx - p.x; p.grabOffY = my - p.y;
      p.vx = 0; p.vy = 0; p.rotV = 0; _mhist.length = 0;
      el.style.boxShadow = '0 20px 50px rgba(0,0,0,.6)';
    }
    el.addEventListener('mousedown', e => {
      grab(e.clientX, e.clientY);
      el.style.cursor = 'grabbing';
      e.preventDefault(); e.stopPropagation();
    });
    el.addEventListener('touchstart', e => {
      const t = e.touches[0];
      if (!t) return;
      grab(t.clientX, t.clientY);
      e.preventDefault(); e.stopPropagation();
    }, { passive: false });
  }

  function _launch(){
    _active = true;
    _toast('\ud83c\udfae Chaos mode activated! Grab and throw them around!');
    // The keyboard-shortcut HUD (bomb, gravity, black hole, etc.) only
    // applies to keyboard input, so it's skipped on touch; touch users
    // still get the core drag-and-throw physics.
    if (!_isMobile()) setTimeout(_showHUD, 600);

    // Capture the floor height ONCE, before any chaos elements are added
    // to the page. The falling pieces are position:absolute on <body>, so
    // if we kept re-measuring document.body.scrollHeight every frame (as
    // before), the floor would include the falling items' own position
    // and grow right along with them -- a runaway floor they can never
    // actually reach. Freezing it here to the page's real, unmodified
    // height gives them solid, fixed ground.
    let _floorH = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight, window.innerHeight);

    // Keep it light: just a couple of whole cards, plus a few Play buttons
    // plucked off other cards, rather than dropping all 16 at once.
    const allCards = [...document.querySelectorAll('#grid .card')].filter(c => {
      const r = c.getBoundingClientRect(); return r.width > 0 && r.height > 0;
    });
    const boxCards = _shuffled(allCards).slice(0, Math.min(2, allCards.length));
    const boxSet = new Set(boxCards);

    const playCandidates = [...document.querySelectorAll('#grid .card .play')].filter(el => {
      if (boxSet.has(el.closest('.card'))) return false;
      const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0;
    });
    const playEls = _shuffled(playCandidates).slice(0, Math.min(3, playCandidates.length));

    // Lock the remaining background cards so they can't be clicked/navigated
    // away from while chaos mode is active; the page reload on Shift+R
    // reset naturally clears this.
    grid.classList.add('gn-chaos-lock');

    let si = 0;
    boxCards.forEach(card => {
      const rect = card.getBoundingClientRect();
      const px = rect.left + window.scrollX, py = rect.top + window.scrollY;
      const el = document.createElement('div');
      el.className = 'gn-egg-el card';
      el.innerHTML = card.innerHTML;
      el.style.cssText = 'position:absolute;left:' + px + 'px;top:' + py + 'px;' +
        'width:' + rect.width + 'px;height:' + rect.height + 'px;margin:0;z-index:9999;cursor:grab;touch-action:none;' +
        'box-sizing:border-box;opacity:1;transform:none;animation:none;';
      document.body.appendChild(el);
      card.style.visibility = 'hidden';
      const p = { el, x: px, y: py, w: rect.width, h: rect.height,
        vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 8 - 2,
        rot: 0, rotV: (Math.random() - 0.5) * 6, dragging: false, grabOffX: 0, grabOffY: 0,
        origStyle: { bg: el.style.background, color: el.style.color, border: el.style.border } };
      const _si = si++;
      setTimeout(() => { if (_active) _items.push(p); }, _si * 60);
      _attachDrag(el, p);
    });

    playEls.forEach(playEl => {
      const rect = playEl.getBoundingClientRect();
      const px = rect.left + window.scrollX, py = rect.top + window.scrollY;
      const cs = getComputedStyle(playEl);
      const el = document.createElement('div');
      el.className = 'gn-egg-el play';
      el.innerHTML = playEl.innerHTML;
      el.style.cssText = 'position:absolute;left:' + px + 'px;top:' + py + 'px;' +
        'width:' + rect.width + 'px;height:' + rect.height + 'px;margin:0;z-index:9999;cursor:grab;touch-action:none;' +
        'display:' + cs.display + ';align-items:center;justify-content:center;gap:6px;' +
        'font-family:' + cs.fontFamily + ';font-weight:' + cs.fontWeight + ';font-size:' + cs.fontSize + ';' +
        'padding:' + cs.padding + ';border-radius:' + cs.borderRadius + ';background:' + cs.background + ';color:' + cs.color + ';' +
        'box-sizing:border-box;opacity:1;transform:none;animation:none;';
      document.body.appendChild(el);
      playEl.style.visibility = 'hidden';
      const p = { el, x: px, y: py, w: rect.width, h: rect.height,
        vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 8 - 2,
        rot: 0, rotV: (Math.random() - 0.5) * 6, dragging: false, grabOffX: 0, grabOffY: 0,
        origStyle: { bg: el.style.background, color: el.style.color, border: el.style.border } };
      const _si = si++;
      setTimeout(() => { if (_active) _items.push(p); }, _si * 60);
      _attachDrag(el, p);
    });

    const BOUNCE = 0.55, FRIC = 0.973, RFRIC = 0.93, BASE_G = 0.5;
    let prev = performance.now();
    function loop(now){
      if (!_active) return;
      const dt = Math.min((now - prev) / 16, 3); prev = now;
      const vw = window.innerWidth, vh = window.innerHeight;
      // Items live in page (document) coordinates so they scroll naturally
      // with the page; the floor is the real bottom of the document, not
      // just the current viewport, so a tall grid's cards can fall and
      // land further down the page, visible once you scroll to them.
      // Uses the floor height captured once at launch (see _floorH above)
      // rather than re-measuring live, which would include the falling
      // items themselves and let the floor run away from them.
      if (vh > _floorH) _floorH = vh;
      const docH = _floorH;
      // Tornado orbits the center of whatever's currently in view, so it
      // stays visible and centered no matter how far the page is scrolled.
      const cx = window.scrollX + vw / 2, cy = window.scrollY + vh / 2;

      _rainbowT += dt;
      if (_rainbowMode && _items.length){
        _items.forEach((p, i) => {
          if (!p.origStyle) p.origStyle = { bg: p.el.style.background, color: p.el.style.color, border: p.el.style.border };
          const hue = (_rainbowT * 4 + i * 37) % 360;
          p.el.style.background = 'hsl(' + hue + ',80%,50%)';
          p.el.style.color = '#12151c';
          p.el.style.borderColor = 'transparent';
        });
      }

      _windX *= 0.97; _windY *= 0.97;
      if (Math.abs(_windX) < 0.01) _windX = 0;
      if (Math.abs(_windY) < 0.01) _windY = 0;
      if (_earthquake > 0) _earthquake -= dt;

      for (let bhi = _blackHoles.length - 1; bhi >= 0; bhi--){
        const bh = _blackHoles[bhi];
        bh.t += dt;
        const prog = bh.t / bh.maxT;
        bh.el.style.transform = 'translate(-50%,-50%) scale(' + (1 + prog * 0.5) + ')';
        if (bh.t >= bh.maxT){
          bh.el.style.transition = 'transform .15s';
          bh.el.style.transform = 'translate(-50%,-50%) scale(0)';
          _explode(bh.x, bh.y);
          const _bh = bh;
          setTimeout(() => { _bh.el.remove(); _bh.ring && _bh.ring.remove(); }, 200);
          _blackHoles.splice(bhi, 1);
          _hudStatus(_blackHoles.length ? ('\ud83c\udf11 ' + _blackHoles.length + ' black hole(s) active') : '');
        }
      }

      const curG = _freezeMode ? 0 : (_gravMode === 0 ? BASE_G : _gravMode === 1 ? 0 : -BASE_G * 0.55);
      let n = _items.length;
      for (let i = 0; i < n; i++){
        const p = _items[i];
        if (p.dragging) continue;
        if (_freezeMode){ p.vx = 0; p.vy = 0; p.rotV = 0; p.el.style.left = p.x + 'px'; p.el.style.top = p.y + 'px'; continue; }

        p.vy += curG * dt;
        p.vx += _windX * dt; p.vy += _windY * dt;

        if (_magnetMode){
          const mdx = (_mouseX - (p.x + p.w / 2)), mdy = (_mouseY - (p.y + p.h / 2));
          const md = Math.sqrt(mdx * mdx + mdy * mdy) || 1;
          const mf = Math.min(18, 500 / md) * dt;
          p.vx += mdx / md * mf; p.vy += mdy / md * mf;
        }
        if (_tornadoMode){
          const tdx = cx - (p.x + p.w / 2), tdy = cy - (p.y + p.h / 2);
          const td = Math.sqrt(tdx * tdx + tdy * tdy) || 1;
          const phase = i * 2.618 + _rainbowT * 0.8;
          const tangF = 2.8 + Math.sin(phase) * 1.4 + Math.cos(phase * 0.7) * 0.9;
          p.vx += (-tdy / td) * tangF * dt; p.vy += (tdx / td) * tangF * dt;
          const radF = Math.sin(_rainbowT * 0.6 + i * 1.9) * 0.9 + Math.cos(_rainbowT * 0.4 + i * 3.1) * 0.5;
          p.vx += (tdx / td) * radF * dt; p.vy += (tdy / td) * radF * dt;
        }
        for (const bh of _blackHoles){
          const bhdx = bh.x - (p.x + p.w / 2), bhdy = bh.y - (p.y + p.h / 2);
          const bhd = Math.sqrt(bhdx * bhdx + bhdy * bhdy) || 1;
          const strength = (bh.t / bh.maxT) * 7 + 2;
          p.vx += bhdx / bhd * strength * dt; p.vy += bhdy / bhd * strength * dt;
          p.rotV += strength * 0.3 * dt;
        }
        if (_earthquake > 0){
          p.vx += (Math.random() - 0.5) * 18 * dt; p.vy += (Math.random() - 0.5) * 14 * dt;
          p.rotV += (Math.random() - 0.5) * 20 * dt;
        }

        p.vx *= Math.pow(FRIC, dt);
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rotV *= Math.pow(RFRIC, dt); p.rot += p.rotV * dt;

        if (p.isDebris){
          if (p.y > window.scrollY + vh + 300 || p.x < -300 || p.x > vw + 300){ p.el.remove(); _items.splice(i, 1); i--; n--; continue; }
        } else if (_gravMode !== 2){
          if (p.y + p.h >= docH){ p.y = docH - p.h; p.vy *= -BOUNCE; p.vx *= 0.82; p.rotV *= 0.55; if (Math.abs(p.vy) < 1) p.vy = 0; }
          if (p.y < 0){ p.y = 0; p.vy *= -BOUNCE; }
        } else {
          if (p.y < 0){ p.y = 0; p.vy *= -BOUNCE; }
          if (p.y + p.h > docH){ p.y = docH - p.h; p.vy *= -BOUNCE; }
        }
        if (p.x + p.w >= vw){ p.x = vw - p.w; p.vx *= -BOUNCE; p.rotV *= -0.6; }
        if (p.x < 0){ p.x = 0; p.vx *= -BOUNCE; p.rotV *= -0.6; }

        if (p.isConfetti){
          p.vx *= 0.985; p.vy *= 0.995;
          if (p.life !== undefined){
            p.life -= dt;
            if (p.life < 60) p.el.style.opacity = Math.max(0, p.life / 60);
            if (p.life < -10){ p.el.remove(); _items.splice(i, 1); i--; n--; continue; }
          }
        }

        p.el.style.left = p.x + 'px'; p.el.style.top = p.y + 'px';
        p.el.style.transform = 'rotate(' + p.rot + 'deg)';
      }

      for (let pass = 0; pass < 2; pass++){
        for (let ci = 0; ci < _items.length; ci++){
          const ca = _items[ci];
          if (ca.isConfetti || ca.isDebris || ca.dragging) continue;
          for (let cj = ci + 1; cj < _items.length; cj++){
            const cb = _items[cj];
            if (cb.isConfetti || cb.isDebris || cb.dragging) continue;
            _collide(ca, cb);
          }
        }
      }

      for (let bi = _bombs.length - 1; bi >= 0; bi--){
        const b = _bombs[bi];
        b.vy += BASE_G * 1.3 * dt;
        b.x += b.vx * dt; b.y += b.vy * dt;
        b.rot += 3 * dt;
        b.el.style.left = b.x + 'px'; b.el.style.top = b.y + 'px';
        b.el.style.transform = 'rotate(' + b.rot + 'deg)';
        if (b.y + b.size >= window.scrollY + vh - 10){
          _explode(b.x + b.size / 2, b.y + b.size / 2);
          b.el.remove(); _bombs.splice(bi, 1);
        }
      }

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }
})();

</script>
