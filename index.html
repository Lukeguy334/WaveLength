<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #12151c;
    --ink-2: #191f29;
    --panel: #1c232f;
    --panel-line: #313c4c;
    --brass: #c9a24b;
    --brass-bright: #e8c572;
    --teal: #4fd1c5;
    --rose: #e2637a;
    --paper: #ede7d9;
    --muted: #8791a1;
    --shadow: rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(ellipse at 50% -10%, #232c3a 0%, var(--ink) 55%);
    color: var(--paper);
    font-family: 'Inter', sans-serif;
  }

  body {
    display: flex;
    justify-content: center;
    padding: 56px 20px 72px;
  }

  .wrap { width: 100%; max-width: 900px; }

  /* ---------- Header ---------- */
  header { margin-bottom: 44px; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .eyebrow .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 6px var(--teal);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(38px, 7vw, 58px);
    letter-spacing: 0.02em;
    margin: 0 0 10px;
    background: linear-gradient(180deg, var(--brass-bright), var(--brass));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p {
    font-size: 15px;
    color: var(--muted);
    max-width: 46ch;
    line-height: 1.55;
    margin: 0;
  }

  /* ---------- Game grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }

  .card {
    position: relative;
    background: linear-gradient(180deg, #202836, #171d27);
    border: 1px solid var(--panel-line);
    border-radius: 16px;
    padding: 26px 22px 22px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    box-shadow: 0 14px 28px var(--shadow), inset 0 1px 0 rgba(255,255,255,0.03);
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.5s ease forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .card:hover, .card:focus-visible {
    transform: translateY(-3px);
    border-color: var(--brass);
    box-shadow: 0 18px 34px var(--shadow), 0 0 0 1px rgba(201,162,75,0.25);
  }
  .card:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

  .rivet {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--brass-bright), var(--brass) 60%, #7a5f28 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .rivet.tl { top: 10px; left: 12px; }
  .rivet.tr { top: 10px; right: 12px; }

  .card .icon {
    width: 58px;
    height: 34px;
    margin-bottom: 16px;
  }

  .card h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 21px;
    margin: 0 0 6px;
    letter-spacing: 0.01em;
  }

  .card .tagline {
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.5;
    margin: 0 0 18px;
    flex: 1;
  }

  .card .meta-row {
    display: flex;
    gap: 14px;
    margin-bottom: 18px;
  }

  .card .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card .meta b { color: var(--paper); font-weight: 600; }

  .card .play {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 11px 16px;
    border-radius: 9px;
    background: linear-gradient(180deg, var(--brass-bright), var(--brass));
    color: #1c1305;
  }

  .card .play .arrow { transition: transform 0.15s ease; }
  .card:hover .play .arrow { transform: translateX(3px); }

  /* ---------- Empty slot ---------- */
  .slot {
    border: 1px dashed var(--panel-line);
    border-radius: 16px;
    padding: 26px 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    min-height: 180px;
  }

  footer {
    margin-top: 48px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .card { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow"><span class="dot"></span> 2 games online</div>
    <h1>Game Night</h1>
    <p>Browser games built for playing with people &mdash; no installs, no accounts. Pick one below.</p>
  </header>

  <div class="grid" id="grid"></div>

  <footer>More games get added to the rack as they're built.</footer>
</div>

<script>
  // Add a new object here to add a new game to the page.
  const GAMES = [
    {
      title: 'Wavelength',
      tagline: 'Give a one-word clue. Your team guesses where it lands on the hidden dial. Play locally on one screen, or host an online room and play across two.',
      players: '2+',
      time: '~20 min',
      href: 'wavelength.html',
      icon: `<svg viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 62 A 50 50 0 0 1 110 62" fill="none" stroke="var(--panel-line)" stroke-width="6" stroke-linecap="round"/>
        <path d="M22 62 A 38 38 0 0 1 55 26" fill="none" stroke="var(--teal)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
        <line x1="60" y1="62" x2="86" y2="24" stroke="var(--rose)" stroke-width="4" stroke-linecap="round"/>
        <circle cx="60" cy="62" r="5" fill="var(--brass-bright)"/>
      </svg>`
    },
    {
      title: 'Gin Rummy',
      tagline: 'Meld sets and runs, play off the table at will, and race to go out. House rules included &mdash; deep discard takes, grabbing missed cards, and a few surprises.',
      players: '2\u20134',
      time: '~15 min/hand',
      href: 'gin-rummy.html',
      icon: `<svg viewBox="0 0 120 70" xmlns="http://www.w3.org/2000/svg">
        <rect x="14" y="10" width="34" height="48" rx="5" fill="#f6f3ea" stroke="var(--panel-line)" stroke-width="2" transform="rotate(-8 31 34)"/>
        <rect x="44" y="8" width="34" height="48" rx="5" fill="#f6f3ea" stroke="var(--panel-line)" stroke-width="2"/>
        <rect x="72" y="12" width="34" height="48" rx="5" fill="#f6f3ea" stroke="var(--panel-line)" stroke-width="2" transform="rotate(8 89 36)"/>
        <text x="61" y="34" font-family="Georgia,serif" font-size="16" fill="var(--rose)" text-anchor="middle">K&#9829;</text>
      </svg>`
    }
  ];

  const grid = document.getElementById('grid');

  GAMES.forEach((game, i) => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = game.href;
    card.style.animationDelay = (i * 0.06) + 's';
    card.innerHTML = `
      <div class="rivet tl"></div>
      <div class="rivet tr"></div>
      <div class="icon">${game.icon}</div>
      <h2>${game.title}</h2>
      <p class="tagline">${game.tagline}</p>
      <div class="meta-row">
        <span class="meta">Players <b>${game.players}</b></span>
        <span class="meta">Time <b>${game.time}</b></span>
      </div>
      <span class="play">Play <span class="arrow">&rarr;</span></span>
    `;
    grid.appendChild(card);
  });

  // Fill remaining grid slots with a quiet placeholder so the rack doesn't look empty with just one game.
  if (GAMES.length < 2){
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.textContent = 'Next game slot open.';
    grid.appendChild(slot);
  }
</script>

</body>
</html>
